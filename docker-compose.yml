services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: digest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: digest
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digest -d digest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://digest:${POSTGRES_PASSWORD}@db:5432/digest
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'if [ -z "$$DOMAIN" ]; then echo ".env に DOMAIN（APP_URL と同じホスト名）を設定してください" >&2; exit 1; fi; exec caddy reverse-proxy --from "$$DOMAIN" --to app:3000'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
